name: Release

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., 1.0.0)'
        required: true
        type: string

permissions: {}

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # Credentials stay persisted: the "Create or verify tag" step pushes.
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Get tag name
        id: get_tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi

          # Only plain X.Y.Z tags are ever released; this also guarantees the
          # value is safe to use in every later step.
          if ! [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid tag (expected X.Y.Z)"
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create or verify tag
        env:
          TAG: ${{ steps.get_tag.outputs.tag }}
        run: |
          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "✅ Tag $TAG already exists"
          else
            echo "📝 Creating tag $TAG"
            # Extract version for commit message
            VERSION="${TAG#v}"
            git tag -a "$TAG" -m "Release version $VERSION"
            git push origin "$TAG"
            echo "✅ Tag $TAG created and pushed"
          fi

      - name: Extract version from tag
        id: version
        env:
          TAG: ${{ steps.get_tag.outputs.tag }}
        run: |
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Check if CHANGELOG exists
        id: check_changelog
        run: |
          if [ -f CHANGELOG.md ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "✅ CHANGELOG.md found"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "⚠️ CHANGELOG.md not found"
          fi

      - name: Extract release notes from CHANGELOG
        id: changelog
        if: steps.check_changelog.outputs.exists == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Literal (non-regex) match: print everything after this version's
          # header up to, but excluding, the next "## [" header.
          awk -v header="## [$VERSION]" '
              index($0, header) == 1 { found = 1; next }
              found && index($0, "## [") == 1 { exit }
              found { print }
          ' CHANGELOG.md > release_notes.md

          if grep -q '[^[:space:]]' release_notes.md; then
            echo "✅ Extracted release notes for version $VERSION"
            echo "has_notes=true" >> "$GITHUB_OUTPUT"
          else
            echo "⚠️ No section found for version $VERSION in CHANGELOG.md"
            echo "has_notes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate release artifacts
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Create a release directory
          mkdir -p release-artifacts

          # Copy key files
          cp Brewfile release-artifacts/

          # Create a tarball of the dotfiles (excluding .git and other artifacts)
          tar -czf "release-artifacts/dotfiles-${VERSION}.tar.gz" \
            --exclude='.git' \
            --exclude='release-artifacts' \
            --exclude='release_notes.md' \
            --exclude='analysis' \
            --exclude='*audit-report*' \
            --exclude='.DS_Store' \
            .

          echo "✅ Release artifacts created"
          ls -lh release-artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ steps.get_tag.outputs.tag }}
          name: Release ${{ steps.get_tag.outputs.tag }}
          body_path: ${{ steps.changelog.outputs.has_notes == 'true' && 'release_notes.md' || '' }}
          draft: false
          prerelease: false
          generate_release_notes: ${{ steps.changelog.outputs.has_notes != 'true' }}
          files: |
            release-artifacts/Brewfile
            release-artifacts/dotfiles-${{ steps.version.outputs.version }}.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release summary
        env:
          TAG: ${{ steps.get_tag.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          HAS_NOTES: ${{ steps.changelog.outputs.has_notes }}
          REPOSITORY: ${{ github.repository }}
        run: |
          {
              echo "## 🎉 Release Created Successfully"
              echo ""
              echo "**Tag**: $TAG"
              echo "**Version**: $VERSION"
              echo ""
              echo "### Release Artifacts"
              echo "- ✅ Brewfile"
              echo "- ✅ dotfiles-${VERSION}.tar.gz"
              echo ""
              echo "### Release Notes"
              if [ "$HAS_NOTES" = "true" ]; then
                  echo "- ✅ Extracted from CHANGELOG.md"
              else
                  echo "- ℹ️ Auto-generated from commits"
              fi
              echo ""
              echo "🔗 [View Release](https://github.com/${REPOSITORY}/releases/tag/${TAG})"
          } >> "$GITHUB_STEP_SUMMARY"
