name: Auto Tag Release

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: auto-tag-main
  cancel-in-progress: false

jobs:
  check:
    name: Check if release-worthy
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      skip: ${{ steps.files.outputs.skip }}

    steps:
      - name: Determine changed files
        id: files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "ℹ️ Manually triggered — skipping file-based release check"
            exit 0
          fi

          CHANGED_FILES=$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}/files" --paginate --jq '.[].filename')
          echo "Changed files:"
          echo "$CHANGED_FILES"

          # Skip tagging a release when a PR only touches plumbing (.github/**)
          # or docs (*.md) — those don't warrant a release on their own.
          SKIP=true
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            case "$file" in
              .github/*|*.md) ;;
              *) SKIP=false ;;
            esac
          done <<< "$CHANGED_FILES"

          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"
          if [ "$SKIP" = "true" ]; then
            echo "ℹ️ All changed files are plumbing/docs (.github/** or *.md) — skipping release"
          fi

  tag:
    name: Tag Release
    needs: check
    if: needs.check.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write

    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Determine latest version
        id: latest
        run: |
          LATEST_TAG=$(git tag -l '[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)
          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG="0.0.0"
          fi
          echo "tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"
          echo "Latest tag: $LATEST_TAG"

      - name: Determine version bump
        id: bump
        env:
          LATEST_TAG: ${{ steps.latest.outputs.tag }}
        run: |
          if git rev-parse "$LATEST_TAG" >/dev/null 2>&1; then
            RANGE="$LATEST_TAG..HEAD"
          else
            RANGE="HEAD"
          fi

          # The commit this run analyses. The release must be cut from exactly
          # this commit; the changelog step fails if main has moved on.
          ANALYSED=$(git rev-parse HEAD)
          echo "analysed=$ANALYSED" >> "$GITHUB_OUTPUT"

          # Nothing to release: no commits since the last tag, or only the
          # bot's own chore(release) commits (a changelog PR that merged but
          # was never tagged must not trigger a release of its own).
          COUNT=$(git rev-list --count "$RANGE")
          NON_RELEASE=$(git log --format='%s' "$RANGE" | grep -vcE '^chore\(release\):' || true)
          if [ "$COUNT" -eq 0 ] || [ "$NON_RELEASE" -eq 0 ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "ℹ️ No releasable commits in $RANGE ($COUNT commit(s), $NON_RELEASE not chore(release)) — no tag created"
            echo "ℹ️ No releasable commits since ${LATEST_TAG} — no tag created" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "release=true" >> "$GITHUB_OUTPUT"

          COMMITS=$(git log --format='%B' "$RANGE")

          # Conventional Commits: feat! / fix(scope)!: / "BREAKING CHANGE:" -> major,
          # feat: -> minor, everything else (fix/chore/docs/refactor/etc) -> patch.
          BUMP="patch"
          if echo "$COMMITS" | grep -qE '^[a-z]+(\([^)]*\))?!:|BREAKING CHANGE:'; then
            BUMP="major"
          elif echo "$COMMITS" | grep -qE '^feat(\([^)]*\))?:'; then
            BUMP="minor"
          fi

          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"
          echo "Version bump: $BUMP"

      - name: Calculate next version
        id: next
        if: steps.bump.outputs.release == 'true'
        env:
          LATEST_TAG: ${{ steps.latest.outputs.tag }}
          BUMP: ${{ steps.bump.outputs.bump }}
        run: |
          # Defensive: never do arithmetic or tagging on unexpected values.
          if ! [[ "$LATEST_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Unexpected latest tag format"
            exit 1
          fi

          IFS='.' read -r MAJOR MINOR PATCH <<< "$LATEST_TAG"

          case "$BUMP" in
            major)
              MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1)); PATCH=0
              ;;
            *)
              PATCH=$((PATCH + 1))
              ;;
          esac

          NEXT_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "version=$NEXT_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$NEXT_VERSION" >> "$GITHUB_OUTPUT"
          echo "Next version: $NEXT_VERSION"

      - name: Update CHANGELOG.md
        id: changelog
        if: steps.bump.outputs.release == 'true'
        env:
          VERSION: ${{ steps.next.outputs.version }}
        run: |
          TODAY=$(date +%Y-%m-%d)

          if [ -f CHANGELOG.md ] && grep -q '^## \[Unreleased\]$' CHANGELOG.md; then
            sed -i "s/^## \[Unreleased\]$/## [Unreleased]\n\n## [${VERSION}] - ${TODAY}/" CHANGELOG.md
            git add CHANGELOG.md
            echo "updated=true" >> "$GITHUB_OUTPUT"
          else
            echo "⚠️ No '## [Unreleased]' section found in CHANGELOG.md, skipping update"
            echo "updated=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit CHANGELOG update via PR
        if: steps.bump.outputs.release == 'true' && steps.changelog.outputs.updated == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.next.outputs.tag }}
          ANALYSED: ${{ steps.bump.outputs.analysed }}
        run: |
          # The version and changelog were computed from $ANALYSED. If main has
          # moved since, tagging would release commits that were never
          # analysed (wrong bump, missing notes). Stop before any side effect
          # (branch, push, PR); a queued run or a re-dispatch releases them.
          git fetch origin main
          CURRENT=$(git rev-parse origin/main)
          if [ "$CURRENT" != "$ANALYSED" ]; then
            echo "::error::main moved from ${ANALYSED} to ${CURRENT} while this run was in progress; nothing was tagged or pushed. A queued run, or a re-run of this workflow (workflow_dispatch), will release it."
            exit 1
          fi

          BRANCH="release/changelog-${VERSION}"

          # main is protected: changes must land via PR, not a direct push.
          git checkout -b "$BRANCH"
          git commit -m "chore(release): ${VERSION}"
          git push origin "$BRANCH"

          PR_URL=$(gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore(release): ${VERSION}" \
            --body "Automated CHANGELOG update for release ${VERSION}.")

          # GitHub can take a moment to compute mergeability after PR creation; retry briefly.
          merged=false
          for i in 1 2 3 4 5; do
            if gh pr merge "$PR_URL" --rebase --delete-branch; then
              merged=true
              break
            fi
            echo "Merge attempt $i failed, retrying in 5s..."
            sleep 5
          done
          [ "$merged" = true ] || {
            echo "::error::could not merge $PR_URL"
            exit 1
          }

          # Bring main up to date with the merged commit before tagging it.
          git checkout main
          git fetch origin main
          git reset --hard origin/main

      - name: Create and push tag
        if: steps.bump.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT_TAG: ${{ steps.next.outputs.tag }}
        run: |
          git tag -a "$NEXT_TAG" -m "Release $NEXT_TAG"
          git push origin "$NEXT_TAG"

          # A tag pushed with GITHUB_TOKEN does not trigger other workflows'
          # `on: push: tags:` listeners (anti-recursion safeguard), so kick
          # release.yml explicitly instead of relying on that push event.
          gh workflow run release.yml --ref main -f tag="$NEXT_TAG"

      # Dispatching release.yml is fire-and-forget: this job would otherwise go
      # green even when the release run fails, leaving a tag with no GitHub
      # Release and nothing to signal it (this is how 2.1.0 was lost).
      - name: Verify the release was published
        if: steps.bump.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT_TAG: ${{ steps.next.outputs.tag }}
        run: |
          for _ in $(seq 1 30); do
            if gh release view "$NEXT_TAG" >/dev/null 2>&1; then
              echo "✅ Release $NEXT_TAG published"
              exit 0
            fi
            sleep 10
          done

          echo "::error::Tag $NEXT_TAG was pushed but no GitHub Release appeared within 5 minutes."
          {
            echo "## ⚠️ Tag pushed without a release"
            echo ""
            echo "Check the release.yml run, then re-publish with:"
            echo '```'
            echo "gh workflow run release.yml --ref main -f tag=$NEXT_TAG"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Summary
        if: steps.bump.outputs.release == 'true'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          EVENT_NAME: ${{ github.event_name }}
          LATEST_TAG: ${{ steps.latest.outputs.tag }}
          NEXT_TAG: ${{ steps.next.outputs.tag }}
          BUMP: ${{ steps.bump.outputs.bump }}
        run: |
          echo "## 🏷️ Tagged Release" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            echo "**PR**: #${PR_NUMBER} - ${PR_TITLE}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "**Trigger**: manual dispatch" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "**Previous tag**: ${LATEST_TAG}" >> "$GITHUB_STEP_SUMMARY"
          echo "**New tag**: ${NEXT_TAG} (${BUMP} bump)" >> "$GITHUB_STEP_SUMMARY"
