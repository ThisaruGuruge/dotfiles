name: Validate Dotfiles

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main, dev ]
    # The release workflow's bot PR (release/changelog-*) only touches
    # CHANGELOG.md. Runs for github-actions[bot] PRs sit in "approval required"
    # (repo policy: all external contributors) and expire as a red X, because
    # the bot PR is merged immediately. Nothing here validates CHANGELOG.md.
    paths-ignore:
      - CHANGELOG.md

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install shellcheck and zsh
      run: |
        sudo apt-get update
        sudo apt-get install -y shellcheck zsh

    - name: Install shfmt
      run: |
        go install mvdan.cc/sh/v3/cmd/shfmt@v3.7.0
        echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

    - name: Lint (bin/lint)
      run: |
        npm install -g @johnnymorganz/stylua-bin@2.5.2
        bin/lint

    - name: Validate JSON files
      run: |
        echo "Checking JSON syntax..."
        find . -name "*.json" -not -path "./.git/*" | while read -r file; do
          echo "Validating $file"
          python3 -m json.tool "$file" > /dev/null
        done

    - name: Test init script syntax
      run: |
        echo "Testing init.sh syntax..."
        bash -n init.sh

    - name: Check for common issues
      run: |
        echo "Checking for common issues..."

        echo "Checking for hardcoded paths..."

        # Check for variable assignments with hardcoded /Users/ paths
        # (git grep searches tracked files only, so .git/ needs no filter)
        echo "  Checking variable assignments..."
        if git grep -nE '="/Users/' -- '*.sh' ':(glob)**/.zshrc' | grep -v "RANCHER" | grep -v '# ' | grep -v "example"; then
          echo "❌ Found hardcoded paths in variable assignments!"
          exit 1
        fi

        # Check for command usage with hardcoded /Users/ paths
        echo "  Checking command usage..."
        if git grep -nE '(cd|source|\.)[[:space:]]+/Users/' -- '*.sh' ':(glob)**/.zshrc' | grep -v "RANCHER" | grep -v '# ' | grep -v "documentation"; then
          echo "❌ Found hardcoded paths in commands!"
          exit 1
        fi

        echo "✅ No hardcoded paths found"

        echo "Checking for secrets in files..."
        # Look for actual secret patterns, not documentation about secrets.
        # The value must be a non-empty quoted string (signing_key="" is not a secret).
        # The names are alternated so this step's own text is not itself a hit.
        secret_pat="(pass""word|sec""ret|tok""en|k""ey)[[:space:]]*=[[:space:]]*[\"'][^\"'[:space:]]"
        if git grep -nE "$secret_pat" -- '*.sh' ':(glob)**/.zshrc' | grep -v "example" | grep -v "template" | grep -v "your_" | grep -v "github_token_here" | grep -v "ENC\["; then
          echo "❌ Potential secrets found!"
          exit 1
        else
          echo "✅ No secrets found in files"
        fi

        echo "Checking for TODO/FIXME comments..."
        if git grep -nE 'TODO|FIXME' -- '*.sh' ':(glob)**/.zshrc' '*.md'; then
          echo "ℹ️ Found TODO/FIXME comments (informational only)"
        fi

  macos-test:
    runs-on: macos-latest
    if: github.event_name == 'pull_request'

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Test basic installation components
      run: |
        echo "Testing if required commands are available on macOS..."

        # Check if essential commands exist
        command -v zsh || echo "zsh not found (expected on base macOS)"
        command -v git || echo "git not found (expected on base macOS)"

        # Test Homebrew installation detection
        if command -v brew >/dev/null 2>&1; then
          echo "✅ Homebrew is installed"
        else
          echo "ℹ️ Homebrew not installed (expected in CI)"
        fi

        # Test zsh syntax
        echo "Testing zsh configuration syntax..."
        zsh -n zsh/.zshrc

        # Test functions syntax (a zsh file, not bash)
        echo "Testing functions syntax..."
        zsh -n zsh/.functions.sh

        # Test aliases syntax (a zsh file, not bash)
        echo "Testing aliases syntax..."
        zsh -n zsh/.aliases.sh

        # Test paths syntax
        echo "Testing paths syntax..."
        bash -n zsh/.paths.sh

    # The behavioural suites run in a scratch HOME with fake binaries. jq is
    # preinstalled on the macOS runners; tmux is not.
    - name: Install tmux
      run: brew install tmux

    - name: Run shell helper tests
      run: zsh bin/test-shell-helpers

    - name: Run Claude Code config tests
      run: bash tests/claude/check.sh

    - name: Test installation script safety
      run: |
        echo "Testing init.sh safety checks..."

        # Test script can detect it's not in dotfiles directory
        mkdir -p test-dir
        cp init.sh test-dir/
        cd test-dir

        if ./init.sh --dry-run 2>&1 | grep -q "must be run from your dotfiles directory"; then
          echo "✅ Directory detection works"
        else
          echo "❌ Directory detection failed"
          exit 1
        fi
