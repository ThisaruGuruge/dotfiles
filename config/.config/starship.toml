# Starship Configuration - Modern Style with Simple Separators
# Documentation: https://starship.rs/config/

# Timeout for commands (in milliseconds)
command_timeout = 500
scan_timeout = 50

# Using simple but effective separators that work across all terminals
# If you want fancier powerline arrows, ensure your terminal font is set to a Nerd Font

# Format string (left prompt with colored segments)
format = """
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$java\
$nodejs\
$python\
$custom\
$fill\
$cmd_duration\
$time\
$line_break\
$character"""

# Right prompt is empty (we use fill to space things out)
right_format = ""

# Add newline before prompt
add_newline = true

# Fill empty space between left and right sections
[fill]
symbol = " "

# Directory/Path - Colored background with simple separator
# Simplified for performance - removed repo_root detection which causes git operations
[directory]
style = "bg:#3B4252 fg:#D8DEE9 bold"
format = "[ $path ]($style)[$read_only]($read_only_style)[▶](fg:#3B4252)"
truncation_length = 4
truncation_symbol = "…/"
truncate_to_repo = false
read_only = " 󰌾"
read_only_style = "bg:#3B4252 fg:#BF616A bold"
home_symbol = "~"
use_os_path_sep = true

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "🎵 "
"Pictures" = "📷 "
"Projects" = "💼 "
"Desktop" = "🖥️ "
".config" = " "
"Leisure" = "🎮 "
"Setup" = "⚙️ "

# Git branch - Colored background (optimized: no remote branch lookup)
[git_branch]
symbol = " "
style = "bg:#5E81AC fg:#ECEFF4 bold"
format = "[◀](fg:#5E81AC)[ $symbol$branch ](bg:#5E81AC fg:#ECEFF4)[▶](fg:#5E81AC)"
truncation_length = 30
truncation_symbol = "…"
# Performance: disable remote branch tracking
only_attached = true

# Git status - Colored background (optimized: no counts, just indicators)
[git_status]
style = "bg:#BF616A fg:#ECEFF4 bold"
format = "[◀](fg:#BF616A)([ $all_status$ahead_behind ](bg:#BF616A fg:#ECEFF4)[▶](fg:#BF616A))"
conflicted = "⚔️"
ahead = "⇡"
behind = "⇣"
diverged = "⇕"
up_to_date = ""
untracked = "?"
stashed = "📦"
modified = "!"
staged = "+"
renamed = "»"
deleted = "✘"
# Performance optimizations
ignore_submodules = true

# Java - Only show in Java projects
[java]
symbol = "☕"
style = "bg:#D08770 fg:#2E3440 bold"
format = "[◀](fg:#D08770)[ $symbol $version ](bg:#D08770 fg:#2E3440)[▶](fg:#D08770)"
detect_extensions = ["java", "class", "jar", "gradle", "clj", "cljc"]
detect_files = ["pom.xml", "build.gradle.kts", "build.gradle", "build.sbt", ".java-version", "deps.edn", "project.clj", "build.boot", ".sdkmanrc"]
detect_folders = []

# Node.js - Only show in Node projects
[nodejs]
symbol = "⬢"
style = "bg:#A3BE8C fg:#2E3440 bold"
format = "[◀](fg:#A3BE8C)[ $symbol $version ](bg:#A3BE8C fg:#2E3440)[▶](fg:#A3BE8C)"
detect_extensions = ["js", "mjs", "cjs", "ts", "mts", "cts"]
detect_files = ["package.json", ".node-version", ".nvmrc"]
detect_folders = ["node_modules"]
not_capable_style = "bg:#BF616A fg:#ECEFF4 bold"

# Python - Only show in Python projects
[python]
symbol = "🐍"
style = "bg:#EBCB8B fg:#2E3440 bold"
format = '[◀](fg:#EBCB8B)[ $symbol $pyenv_prefix$version(\($virtualenv\)) ](bg:#EBCB8B fg:#2E3440)[▶](fg:#EBCB8B)'
pyenv_version_name = false
pyenv_prefix = ""
python_binary = ["python3", "python", "python2"]
detect_extensions = ["py"]
detect_files = [".python-version", "Pipfile", "pyproject.toml", "requirements.txt", "setup.py", "tox.ini", "requirements.in"]
detect_folders = []

# Username (only in SSH)
[username]
style_user = "bg:#EBCB8B fg:#2E3440 bold"
style_root = "bg:#BF616A fg:#ECEFF4 bold"
format = "[ $user](bg:#EBCB8B fg:#2E3440)[@](bg:#EBCB8B fg:#2E3440)"
disabled = false
show_always = false

# Hostname (only in SSH)
[hostname]
ssh_only = true
style = "bg:#A3BE8C fg:#2E3440 bold"
format = "[$hostname ](bg:#A3BE8C fg:#2E3440)[▶](fg:#A3BE8C)"
disabled = false

# Command duration (only if > 2s)
[cmd_duration]
min_time = 2000
style = "bg:#EBCB8B fg:#2E3440 bold"
format = "[◀](fg:#EBCB8B)[ 󱦟 $duration ](bg:#EBCB8B fg:#2E3440)[▶](fg:#EBCB8B)"

# Character (prompt symbol) - Enhanced with colors
[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold yellow)"

# Ballerina - Fast file-based detection (no shell loops)
# Only checks current dir and immediate parent for Ballerina.toml
[custom.ballerina]
command = "cat $HOME/.ballerina/ballerina-version 2>/dev/null | sed 's/ballerina-//' || echo 'bal'"
detect_files = ["Ballerina.toml"]
detect_folders = []
symbol = "🩰"
style = "bg:#88C0D0 fg:#2E3440 bold"
format = "[◀](fg:#88C0D0)[ $symbol $output ](bg:#88C0D0 fg:#2E3440)[▶](fg:#88C0D0)"
description = "Ballerina version in Ballerina projects"

# Disabled modules for performance
[aws]
disabled = true

[gcloud]
disabled = true

[docker_context]
disabled = true

[kubernetes]
disabled = true

[terraform]
disabled = true

[vagrant]
disabled = true

[nix_shell]
disabled = true

[conda]
disabled = true

[memory_usage]
disabled = true

[package]
disabled = true

[ruby]
disabled = true

[rust]
disabled = true

[golang]
disabled = true

[php]
disabled = true

[perl]
disabled = true

[lua]
disabled = true
