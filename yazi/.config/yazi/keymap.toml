# Yazi keymap overrides
# Extends the built-in defaults via prepend_keymap.

[mgr]
prepend_keymap = [
    # Smart enter: open files, enter directories
    { on = ["l"],       run = "plugin smart-enter", desc = "Enter or open" },
    { on = ["<Enter>"], run = "plugin smart-enter", desc = "Enter or open" },

    # Smart filter (stays active, auto-enters single matches)
    { on = ["F"], run = "plugin smart-filter", desc = "Smart filter" },

    # Smart paste (paste into hovered directory)
    { on = ["P"], run = "plugin smart-paste", desc = "Paste into hovered dir" },

    # Jump to character (vim-like f motion)
    { on = ["f"], run = "plugin jump-to-char", desc = "Jump to char" },

    # Diff two selected files
    { on = ["<C-d>"], run = "plugin diff", desc = "Diff selected files" },

    # Chmod on selected files
    { on = ["c", "m"], run = "plugin chmod", desc = "chmod selected files" },

    # macOS Finder tags
    { on = ["c", "t"], run = "plugin mactag", desc = "Toggle macOS tag" },

    # Bookmark shortcuts
    { on = ["g", "d"], run = "cd ~/Downloads",  desc = "Go to Downloads" },
    { on = ["g", "c"], run = "cd ~/.config",    desc = "Go to Config" },
    { on = ["g", "D"], run = "cd ~/dotfiles",   desc = "Go to Dotfiles" },
]
