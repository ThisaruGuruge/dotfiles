# Yazi configuration
# Only overrides are listed here — yazi merges these with built-in defaults.

[mgr]
ratio          = [1, 4, 3]
sort_by        = "natural"
sort_dir_first = true
linemode       = "size"
show_hidden    = false
show_symlink   = true
scrolloff      = 5
title_format   = "Yazi: {cwd}"

[preview]
wrap       = "no"
tab_size   = 2
max_width  = 600
max_height = 900

[opener]
edit = [
    { run = 'nvim "$@"', block = true, desc = "Neovim", for = "unix" },
]
open = [
    { run = 'open "$@"', desc = "System default", for = "macos" },
]
reveal = [
    { run = 'open -R "$@"', desc = "Reveal in Finder", for = "macos" },
]

[open]
prepend_rules = [
    { mime = "text/*",           use = ["edit", "open"] },
    { mime = "application/json", use = ["edit", "open"] },
    { mime = "application/pdf",  use = ["open"] },
]

# mime-ext has no gitignore awareness, so walking a large node_modules/build/
# target for MIME types is pure waste — skip it via yazi's built-in no-op
# fetcher. .git is never something .gitignore describes, so it's excluded
# here too. Each rule must share its `group`/`prio` with the real rule it
# shadows: fetchers dedupe per (group, priority tier), a mismatch on either
# lets the real fetcher queue anyway.
[[plugin.prepend_fetchers]]
group = "file"
url   = "**/{.git,node_modules,build,target}/**"
run   = "noop"
prio  = "high"

# The git fetcher (yazi-rs/plugins:git) is already gitignore-aware — it runs
# `git status --ignored`, marks an ignored directory `excluded`, and does not
# recurse into it. So only .git needs excluding here: it can't be gitignored,
# and `git status` run from inside it is meaningless.
[[plugin.prepend_fetchers]]
group = "file"
url   = "**/.git/**"
run   = "noop"

[[plugin.prepend_fetchers]]
group = "dir"
url   = "**/.git/"
run   = "noop"

[[plugin.prepend_fetchers]]
group = "dir"
url   = "**/.git/**/"
run   = "noop"

[[plugin.prepend_fetchers]]
id    = "mime"
group = "file"
url   = "local://*"
run   = "mime-ext.local"
prio  = "high"

[[plugin.prepend_fetchers]]
id    = "mime"
group = "file"
url   = "remote://*"
run   = "mime-ext.remote"
prio  = "high"

[[plugin.prepend_fetchers]]
id    = "git"
group = "file"
url   = "*"
run   = "git"

[[plugin.prepend_fetchers]]
id    = "git"
group = "dir"
url   = "*/"
run   = "git"
