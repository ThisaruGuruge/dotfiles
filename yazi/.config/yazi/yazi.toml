# Yazi configuration
# Only overrides are listed here — yazi merges these with built-in defaults.

[mgr]
ratio          = [1, 4, 3]
sort_by        = "natural"
sort_dir_first = true
linemode       = "size"
show_hidden    = false
show_symlink   = true
scrolloff      = 5
title_format   = "Yazi: {cwd}"

[preview]
wrap       = "no"
tab_size   = 2
max_width  = 600
max_height = 900

[opener]
edit = [
    { run = 'nvim "$@"', block = true, desc = "Neovim", for = "unix" },
]
open = [
    { run = 'open "$@"', desc = "System default", for = "macos" },
]
reveal = [
    { run = 'open -R "$@"', desc = "Reveal in Finder", for = "macos" },
]

[open]
prepend_rules = [
    { mime = "text/*",           use = ["edit", "open"] },
    { mime = "application/json", use = ["edit", "open"] },
    { mime = "application/pdf",  use = ["open"] },
]

[[plugin.prepend_fetchers]]
id    = "mime"
group = "file"
url   = "local://*"
run   = "mime-ext.local"
prio  = "high"

[[plugin.prepend_fetchers]]
id    = "mime"
group = "file"
url   = "remote://*"
run   = "mime-ext.remote"
prio  = "high"

[[plugin.prepend_fetchers]]
id    = "git"
group = "file"
url   = "*"
run   = "git"

[[plugin.prepend_fetchers]]
id    = "git"
group = "dir"
url   = "*/"
run   = "git"
