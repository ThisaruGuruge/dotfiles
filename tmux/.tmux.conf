# Tmux Configuration - Modern Setup

# Set default shell to zsh (interactive login shell for aliases/functions)
set -g default-shell /bin/zsh
set -g default-command /bin/zsh

# Set true color
set-option -sa terminal-overrides ",xterm*:Tc"

# Enable extended keys (for Shift+Enter in apps like Claude Code)
set -s extended-keys always
set -as terminal-features 'xterm*:extkeys'

# Pass Shift+Enter through to applications (e.g., newline in Claude Code)
bind-key -n S-Enter send-keys Escape "[13;2u"

# Allow passthrough for image preview in yazi/kitty protocol
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# Enable mouse support
set -g mouse on

# Switch to another session instead of detaching when a session is destroyed
set -g detach-on-destroy off

# Enable system clipboard integration (OSC 52)
set -g set-clipboard on

# Change prefix key to Ctrl-a (more ergonomic than Ctrl-b)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Reload config file
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# Split panes using | and -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Switch panes using Alt-arrow without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Vim-like pane switching (with prefix)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Smart pane switching with awareness of Vim splits (Ctrl+h/j/k/l)
# See: https://github.com/christoomey/vim-tmux-navigator
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'
bind-key -n 'C-\' if-shell "$is_vim" 'send-keys C-\\' 'select-pane -l'

# Restore Ctrl+l for clear screen (use prefix + C-l)
bind C-l send-keys 'C-l'

# Copy mode navigation also respects vim
bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

# Resize panes using Prefix + Arrow keys
bind -r Left resize-pane -L 5
bind -r Right resize-pane -R 5
bind -r Up resize-pane -U 5
bind -r Down resize-pane -D 5

# Enable vi mode for copy mode
setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Quick window/session toggling
bind Space last-window
bind Tab switch-client -l

# Swap panes
bind > swap-pane -D
bind < swap-pane -U

# Break pane into its own window
bind Enter break-pane

# Open new windows in current path
bind c new-window -c "#{pane_current_path}"

# Increase history limit
set -g history-limit 50000

# Show status messages for 4 seconds (default 750ms)
set -g display-time 4000

# Update status bar every 5 seconds (default 15s)
set -g status-interval 5

# Status bar configuration
set -g status-position top
set -g status-bg "#1e1e2e"
set -g status-fg "#cdd6f4"
set -g status-left-length 100
set -g status-right-length 250

# Window status (show zoom indicator with Z flag)
setw -g window-status-current-style "fg=#1e1e2e,bg=#89b4fa"
setw -g window-status-current-format " #I #W#{?window_zoomed_flag, 󰊓,} "
setw -g window-status-style "fg=#cdd6f4,bg=#313244"
setw -g window-status-format " #I #W "

# Status left: prefix indicator + session name + active pane/total
set -g status-left "#{?client_prefix,#[fg=#1e1e2e bg=#f38ba8 bold] PREFIX ,#[fg=#1e1e2e bg=#a6e3a1 bold] #S }#[fg=#cdd6f4,bg=#313244]#{?#{>:#{window_panes},1},  #{pane_index}/#{window_panes},} "

# Status right: vpn | cpu/mem | git branch | battery | date | time
set -g status-right "#[fg=#cdd6f4,bg=#313244]#(~/dotfiles/bin/tmux-status-vpn)#(~/dotfiles/bin/tmux-status-sysinfo) #[fg=#cdd6f4,bg=#313244]|  #(cd #{pane_current_path} && git branch --show-current 2>/dev/null || echo '-') | #(pmset -g batt | grep -Eo '(AC|Battery)' | sed 's/AC/⚡/;s/Battery/󰂃/' | head -1) #(pmset -g batt | grep -o '[0-9]*%%' | head -1) #[fg=#89b4fa,bg=#313244]#[fg=#1e1e2e,bg=#89b4fa,bold] %Y-%m-%d #[fg=#a6e3a1,bg=#89b4fa]#[fg=#1e1e2e,bg=#a6e3a1,bold] %H:%M "

# Pane borders
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"

# Show current directory in pane border title (per-pane, only with multiple panes)
set -g pane-border-status top
set -g pane-border-format "#{?pane_active,#[fg=#89b4fa bg=#313244 bold],#[fg=#6c7086 bg=#1e1e2e]} #I  #{=-35:#{s|#{E:HOME}|~|:pane_current_path}} "
set-hook -g window-layout-changed 'if-shell "[ #{window_panes} -gt 1 ]" "set pane-border-status top" "set pane-border-status off"'
set-hook -g pane-exited 'if-shell "[ #{window_panes} -gt 1 ]" "set pane-border-status top" "set pane-border-status off"'

# Message style
set -g message-style "fg=#1e1e2e,bg=#f9e2af"

# Activity monitoring
setw -g monitor-activity on
set -g visual-activity off

# Escape time for vim
set -sg escape-time 10

# Focus events enabled for terminals that support them
set -g focus-events on

# Quick session switching
bind-key s choose-tree -Zs

# Project sessionizer (Ctrl+f) - fuzzy find and switch to project sessions
bind-key -n C-f run-shell "tmux neww ~/.local/bin/tmux-sessionizer"

# Rounded popup borders (tmux 3.3+)
set -g popup-border-lines rounded

# Toggle status bar
bind-key b set-option status

# Plugins (install with prefix + I)
# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'tmux-plugins/tmux-sessionist'
set -g @plugin 'sainnhe/tmux-fzf'

# Plugin settings
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# Initialize TMUX plugin manager
run '~/.tmux/plugins/tpm/tpm'

# Bindings after TPM to avoid plugin overrides
bind-key G display-popup -E -w 80% -h 80% -d "#{pane_current_path}" "lazygit"