# Tmux Configuration - Modern Setup

# Set default shell to zsh (interactive login shell for aliases/functions)
set -g default-shell /bin/zsh
set -g default-command /bin/zsh

# Set terminal type so $TERM inside panes is correct (prevents escape sequence garbling)
set -g default-terminal "tmux-256color"

# Set true color
set-option -sa terminal-overrides ",xterm*:Tc"

# Enable extended keys (for Shift+Enter in apps like Claude Code)
# 'on' (not 'always') - only advertise extended keys to apps that request it.
# 'always' causes the outer terminal to send all keys in extended format,
# which breaks prefix mode key matching in tmux 3.7b.
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# Pass Shift+Enter through to applications (e.g., newline in Claude Code)
bind-key -n S-Enter send-keys Escape "[13;2u"

# Allow passthrough for image preview in yazi/kitty protocol
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# Enable mouse support
set -g mouse on

# Switch to another session instead of detaching when a session is destroyed
set -g detach-on-destroy off

# Use the current client's terminal size (not the smallest across clients)
# Prevents screen shrinkage when switching between laptop and external display
set-window-option -g window-size largest

# Enable system clipboard integration (OSC 52)
set -g set-clipboard on

# Change prefix key to Ctrl-a (more ergonomic than Ctrl-b)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Reload config file
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# Split panes using | and -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Alt+Left/Right are intentionally NOT bound here: Ghostty sends Option+Left/Right
# as ESC b / ESC f so zsh's word navigation works inside tmux as well.

# Vim-like pane switching (with prefix)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Smart pane switching with awareness of Vim splits (Ctrl+h/j/k/l)
# Uses -F (format string) instead of if-shell subprocess to avoid ~250ms/process
# overhead from endpoint security software scanning each spawned binary.
# #{pane_current_command} is evaluated by tmux internally — zero subprocesses.
bind-key -n 'C-h' if-shell -F '#{m/r:^(nvim?|view|fzf)(diff)?$,#{pane_current_command}}' 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell -F '#{m/r:^(nvim?|view|fzf)(diff)?$,#{pane_current_command}}' 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell -F '#{m/r:^(nvim?|view|fzf)(diff)?$,#{pane_current_command}}' 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell -F '#{m/r:^(nvim?|view|fzf)(diff)?$,#{pane_current_command}}' 'send-keys C-l' 'select-pane -R'
bind-key -n 'C-\' if-shell -F '#{m/r:^(nvim?|view|fzf)(diff)?$,#{pane_current_command}}' 'send-keys C-\\' 'select-pane -l'

# Cmd+Delete (delete to end of line) arrives as Alt+k from Ghostty, because the root
# Ctrl+k above would swallow a raw Ctrl+k. Panes that do not need Alt+k themselves get
# the Ctrl+k that Alt+k stands for (send-keys goes straight to the pane, past the root
# table, so the navigation bind above is not triggered); nvim and fzf get Alt+k as is,
# since Ctrl+k there is window navigation / a different action.
bind-key -n 'M-k' if-shell -F '#{m/r:^(nvim?|view|fzf)(diff)?$,#{pane_current_command}}' 'send-keys M-k' 'send-keys C-k'

# Restore Ctrl+l for clear screen (use prefix + C-l)
bind C-l send-keys 'C-l'

# Copy mode navigation also respects vim
bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

# Resize panes using Prefix + Arrow keys
bind -r Left resize-pane -L 5
bind -r Right resize-pane -R 5
bind -r Up resize-pane -U 5
bind -r Down resize-pane -D 5

# Enable vi mode for copy mode
setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
# `y` in copy mode is owned by tmux-yank (system clipboard), which loads after this line.

# Quick window/session toggling
bind Space last-window
bind Tab switch-client -l

# Swap panes
bind > swap-pane -D
bind < swap-pane -U

# Break pane into its own window
bind Enter break-pane

# Open new windows in current path
bind c new-window -c "#{pane_current_path}"

# Increase history limit
set -g history-limit 50000

# Show status messages for 4 seconds (default 750ms)
set -g display-time 4000

# (status-interval is set after the plugins load, below: tmux-sensible resets it.)

# Status bar configuration
set -g status-position top
set -g status-bg "#1e1e2e"
set -g status-fg "#cdd6f4"
set -g status-left-length 100
set -g status-right-length 170

# Window status (tabs)
#   zoom      Z flag shows 󰊓
#   bell      window_bell_flag shows "!" and the tab turns peach
#   activity  yellow underlined text (monitor-activity), no marker
#   Claude    @claude_state (set per window by bin/claude-tmux-state from Claude Code
#             hooks): waiting = red tab + 󰂞, done = green tab + ✔, working = blue ⋯.
#             The tab colour only applies to windows you are not looking at; the
#             current tab keeps its blue background and just gains the glyph.
#             A "done" marker is cleared when you visit the window (hooks below).
# Red/green are reserved for Claude state; bell and activity use peach/yellow.
set -g @claude_glyph "#{?#{==:#{@claude_state},waiting}, 󰂞,#{?#{==:#{@claude_state},done}, ✔,#{?#{==:#{@claude_state},working}, ⋯,}}}"
set -g @claude_tab_style "#{?#{==:#{@claude_state},waiting},#[fg=#1e1e2e bg=#f38ba8 bold],#{?#{==:#{@claude_state},done},#[fg=#1e1e2e bg=#a6e3a1],#{?#{==:#{@claude_state},working},#[fg=#89b4fa],}}}"
setw -g window-status-current-style "fg=#1e1e2e,bg=#89b4fa"
setw -g window-status-current-format " #I #W#{?window_zoomed_flag, 󰊓,}#{?window_bell_flag, !,}#{E:@claude_glyph} "
setw -g window-status-style "fg=#cdd6f4,bg=#313244"
setw -g window-status-format "#{E:@claude_tab_style} #I #W#{?window_bell_flag, !,}#{E:@claude_glyph} "
setw -g window-status-bell-style "fg=#1e1e2e,bg=#fab387,bold"
setw -g window-status-activity-style "fg=#f9e2af,bg=#313244,underscore"

# Status left: prefix indicator + session name + active pane/total
set -g status-left "#{?client_prefix,#[fg=#1e1e2e bg=#f38ba8 bold] PREFIX ,#[fg=#1e1e2e bg=#a6e3a1 bold] #S }#[fg=#cdd6f4,bg=#313244]#{?#{>:#{window_panes},1},  #{pane_index}/#{window_panes},} "

# Status right: Claude waiting summary | sysinfo (☕ while `awake` holds, load, ram) | battery | date | time
# The Claude segment is empty unless a window is waiting on you.
# Git branch intentionally omitted — it lives in the shell prompt (always accurate, no polling).
set -g status-right "#(~/dotfiles/bin/tmux-status-claude)#[fg=#cdd6f4,bg=#313244] #(~/dotfiles/bin/tmux-status-sysinfo)   #(~/dotfiles/bin/tmux-status-battery) #[fg=#89b4fa,bg=#313244]#[fg=#1e1e2e,bg=#89b4fa,bold] %a %d %b #[fg=#a6e3a1,bg=#89b4fa]#[fg=#1e1e2e,bg=#a6e3a1,bold] %H:%M "

# Pane borders
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"

# Show current directory in pane border title (per-pane, only with multiple panes)
set -g pane-border-status top
set -g pane-border-format "#{?pane_active,#[fg=#89b4fa bg=#313244 bold],#[fg=#6c7086 bg=#1e1e2e]} #I  #{=-35:#{s|#{E:HOME}|~|:pane_current_path}} "
set-hook -g window-layout-changed 'if-shell -F "#{>:#{window_panes},1}" "set pane-border-status top" "set pane-border-status off"'
set-hook -g pane-exited 'if-shell -F "#{>:#{window_panes},1}" "set pane-border-status top" "set pane-border-status off"'

# Message style
set -g message-style "fg=#1e1e2e,bg=#f9e2af"

# Activity and bell monitoring (styles are set with the window status above)
setw -g monitor-activity on
setw -g monitor-bell on
set -g visual-activity off
set -g visual-bell off

# Claude Code state markers: a finished ("done") window counts as seen once you
# visit it. "waiting" and "working" are only changed by Claude Code's own hooks.
set-hook -g session-window-changed 'if-shell -F "#{==:#{@claude_state},done}" "set-option -wu @claude_state"'
set-hook -g client-session-changed 'if-shell -F "#{==:#{@claude_state},done}" "set-option -wu @claude_state"'

# Escape time for vim
set -sg escape-time 10

# Focus events enabled for terminals that support them
set -g focus-events on

# Session switcher via fzf popup (choose-tree broken in tmux 3.7b for resurrected sessions)
# Numbered shortcuts (1-9) mirror choose-tree's bracketed jump keys; see
# tmux-session-switcher for details. Sessions with a window waiting on Claude are marked 󰂞.
bind-key s display-popup -E -w 50% -h 45% -T " Sessions " ~/.local/bin/tmux-session-switcher

# Project sessionizer (prefix + f) - fuzzy find and switch to project sessions (popup)
bind-key f display-popup -E -w 60% -h 50% -T " Sessionizer " ~/.local/bin/tmux-sessionizer

# Rounded popup borders (tmux 3.3+)
set -g popup-border-lines rounded
set -g popup-border-style "fg=#89b4fa"

# Toggle status bar
bind-key b set-option status

# Jump to the next window where Claude Code is waiting for you (any session)
# (the guard makes a missing helper visible: new scripts need `bestow stow tmux`)
bind-key A run-shell 'f=~/.local/bin/tmux-claude-next; if [ -x "$f" ]; then "$f"; else tmux display-message "tmux-claude-next not found: run bestow stow tmux"; fi'

# Plugins (install with prefix + I)
# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'tmux-plugins/tmux-sessionist'
set -g @plugin 'sainnhe/tmux-fzf'

# Plugin settings
set -g @resurrect-capture-pane-contents 'on'
# pgrep instead of one `ps -ao ppid,args` per pane when saving (same data for nvim/ssh)
set -g @resurrect-save-command-strategy 'pgrep'
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-processes 'nvim ssh'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'
# tmux-sessionist: move join-pane from `t` to `J` (`t` is our floating terminal below)
set -g @sessionist-join-pane 'J'

# Initialize TMUX plugin manager
run '~/.tmux/plugins/tpm/tpm'

# Bindings after TPM to avoid plugin overrides

# Refresh the status bar every 15 seconds. This has to come after the plugins:
# tmux-sensible lowers status-interval to 5 whenever it is still the default 15 when
# it loads. The sysinfo and battery segments change slowly, so polling faster only costs
# forks; Claude Code state changes (see @claude_state above) call `refresh-client -S`
# and show at once.
set -g status-interval 15

# Deliberate override of tmux-sessionist: `S` (its "switch to last session", which
# `Tab` still does) opens the new-session popup instead. Its join-pane key moved to `J`
# above, so `t` below no longer shadows anything.
# --- Floating Popups ---
bind-key t display-popup -E -w 80% -h 80% -T " Terminal " -d "#{pane_current_path}"
bind-key N display-popup -E -w 70% -h 70% -T " Scratchpad " "nvim ~/.scratch.md"
bind-key S display-popup -E -w 50% -h 30% -T " New Session " ~/.local/bin/tmux-session-creator
bind-key G display-popup -E -w 80% -h 80% -d "#{pane_current_path}" lazygit
bind-key ? display-popup -E -w 70% -h 70% -T " Command Palette " ~/.local/bin/tmux-palette