# Bestow Configurations

# Config File Version
version: 0.1.0

# Bestow Profiles. Different profiles can have different source and destinations
profiles:
  default:
    # Source Directory (the dotfiles repo). Left empty on purpose: ~/.zshenv exports
    # BESTOW_SOURCE from $DOTFILES, so this file holds no machine-specific path and the
    # repo can live anywhere. `bestow init` writes an absolute path here; do not commit it.
    source: ""
    # Destination Directory. Empty means your $HOME directory.
    destination: ""
